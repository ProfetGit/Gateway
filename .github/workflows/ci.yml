name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ci:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Typecheck (electron)
        run: npm run typecheck:electron

      - name: Lint
        run: npm run lint

      - name: Check for leaked secrets
        run: npm run check:secrets

      - name: Test
        run: npm test

      # Proves the electron-builder config still packages, so a broken build
      # block is caught on the PR rather than at tag time.
      - name: Package AppImage
        run: npm run build

      - uses: actions/upload-artifact@v4
        with:
          name: gateway-appimage
          path: release/*.AppImage
          if-no-files-found: error
